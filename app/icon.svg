<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="zBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="zShine" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded purple tile -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#zBg)"/>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#zShine)"/>

  <!-- Bold geometric Z: top bar, diagonal stroke (peak), bottom bar -->
  <path
    d="M16 16 H48 L48 22 L26 42 H48 V48 H16 V42 L38 22 H16 Z"
    fill="#FFFFFF"
  />

  <!-- Subtle accent dot — like a peak marker -->
  <circle cx="48" cy="16" r="2.5" fill="#F0ABFC"/>
</svg>
